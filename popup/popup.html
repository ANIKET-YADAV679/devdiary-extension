<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevDiary</title>
    <link rel="stylesheet" href="popup.css">
</head>

<body>
    <div class="container">
        <header>
            <h3>DevDiary</h3>
            <span class="status-badge" id="trackingStatus">Active</span>
        </header>

        <div class="timer-section">
            <span class="label">Today's Focus</span>
            <h1 id="focusTimer">00:00:00</h1>
        </div>

        <div class="breakdown-section">
            <div class="breakdown-header">
                <span>Active Sites</span>
                <span id="siteCount">0 sites</span>
            </div>
            <ul class="domain-list" id="domainList">
                <li class="empty-state">No activity recorded today</li>
            </ul>
        </div>

        <div class="actions">
            <button id="toggleBtn" class="btn btn-secondary">Pause Tracking</button>
            <button id="copyBtn" class="btn btn-primary">Copy Summary</button>
        </div>
    </div>
    <script src="popup.js"></script>
</body>

</html>
